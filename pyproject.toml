[project]
name = "navdet"
version = "0.1.0"
description = "Object detection and distance estimation for robot navigation: cones, barriers, stop signs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyarrow>=17",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxslim>=0.1.34",
    "pyyaml>=6",
    "pillow>=10",
]

[project.scripts]
navdet = "navdet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navdet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
